server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

      routes:
        - id: book-inventory-service
          uri: lb://BOOK-INVENTORY-SERVICE
          predicates:
            - Path=/api/books/**

        - id: sales-order-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        - id: customer-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/customers/**

        - id: restock-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/restock/**

        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/media/**

sarasavi:
  cors:
    allowed-origins: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
